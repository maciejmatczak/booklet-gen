version: "3"

# Usage: task <name> -- <booklet>      e.g.  task preview -- calendar-a6
# The booklet name is the folder under booklets/.

vars:
  BOOKLET: "{{.CLI_ARGS}}"
  SRC: "booklets/{{.CLI_ARGS}}/main.typ"
  OUT: "build/{{.CLI_ARGS}}"
  # Optional booklet choices: task build INPUTS="--input variant=bw" -- calendar-a6
  # (defined before TYPST_FLAGS: Task resolves vars in order)
  INPUTS: ""
  # Shared Typst flags: repo root for /lib, /data imports; fonts from task setup:fonts.
  TYPST_FLAGS: --root . --font-path fonts {{.INPUTS}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ---- setup: run once after cloning (safe to re-run; skips what's present) ----

  setup:
    desc: Set up the local environment (tools, Python, fonts)
    cmds:
      - task: setup:tools
      - task: setup:python
      - task: setup:fonts
      - task: data # private data JSON must exist for booklets to compile (empty if no .ics)

  setup:tools:
    desc: Install pinned tools from mise.toml (typst, tinymist, task, uv)
    cmds:
      - mise install

  setup:python:
    desc: Create .venv with Python dependencies (uv sync)
    status:
      - test ! -f pyproject.toml # nothing to do until the Python project exists
    cmds:
      - uv sync

  setup:fonts:
    desc: Download pinned fonts into fonts/ (Geist, Geist Mono, Literata, Caveat)
    cmds:
      # Geist + Geist Mono, SIL OFL. https://github.com/vercel/geist-font
      - task: _font
        vars:
          NAME: geist
          VERSION: "1.9.2"
          URL: https://github.com/vercel/geist-font/releases/download/v1.9.2/geist-font-v1.9.2.zip
          SHA256: 15f066d58dcb99fb10014a49913009fdaf41e464cfb8851a44b44e593c95d3d8
          FILES: "'geist-font/Geist/ttf/*.ttf' 'geist-font/GeistMono/ttf/*.ttf'"
      # Literata, SIL OFL. https://github.com/googlefonts/literata
      - task: _font
        vars:
          NAME: literata
          VERSION: "3.103"
          URL: https://github.com/googlefonts/literata/releases/download/3.103/3.103.zip
          SHA256: f7fb973cafb26cf785cbebaeaf51c18f87c15a3bcf4d82a7d4857564db5b056d
          FILES: "'fonts/ttf/*.ttf'"
      # Caveat (handwriting), SIL OFL. https://github.com/googlefonts/caveat
      # No release zips: single files pinned by commit (last font change).
      - task: _font-files
        vars:
          NAME: caveat
          VERSION: "59745e8"
          BASE_URL: https://raw.githubusercontent.com/googlefonts/caveat/59745e818ef7973e11e70cb1358d0e902b56c5fc/fonts/ttf
          FILES: >-
            Caveat-Regular.ttf=7af58d70e539c9195cc328617a68c9961ed804a4404b0b818989ba7c013e8776
            Caveat-Bold.ttf=29e5cf4177d79af56c256c24f687fd6a74c3d04c3c4660ccca87b0a6d1fa3452

  _font:
    internal: true
    # Up to date when this exact version is unpacked; a version bump re-downloads.
    status:
      - test -d fonts/{{.NAME}}-{{.VERSION}}
    cmds:
      - mkdir -p build/cache fonts
      - curl -fsSL -o build/cache/{{.NAME}}-{{.VERSION}}.zip {{.URL}}
      - echo "{{.SHA256}}  build/cache/{{.NAME}}-{{.VERSION}}.zip" | sha256sum -c --quiet
      - rm -rf fonts/{{.NAME}}-*
      - unzip -q -j build/cache/{{.NAME}}-{{.VERSION}}.zip {{.FILES}} -d fonts/{{.NAME}}-{{.VERSION}}

  # Same as _font, for fonts published as loose files. FILES: "file=sha256" pairs.
  _font-files:
    internal: true
    status:
      - test -d fonts/{{.NAME}}-{{.VERSION}}
    cmds:
      - rm -rf fonts/{{.NAME}}-*
      - mkdir -p fonts/{{.NAME}}-{{.VERSION}}.part
      - |
        for entry in {{.FILES}}; do
          file="${entry%%=*}"; sum="${entry#*=}"
          curl -fsSL -o "fonts/{{.NAME}}-{{.VERSION}}.part/$file" "{{.BASE_URL}}/$file"
          echo "$sum  fonts/{{.NAME}}-{{.VERSION}}.part/$file" | sha256sum -c --quiet
        done
      - mv fonts/{{.NAME}}-{{.VERSION}}.part fonts/{{.NAME}}-{{.VERSION}}

  # ---- data ----

  data:
    desc: Generate all data (public + private), 2026-12 → 2028-01
    cmds:
      - task: data:public
      - task: data:private

  data:public:
    desc: Polish holidays + observances → data/public/calendar-pl-2027.json (committed)
    sources:
      - tools/calendar_pl.py
      - uv.lock
    generates:
      - data/public/calendar-pl-2027.json
    cmds:
      - uv run tools/calendar_pl.py --from 2026-12-01 --to 2028-01-31 --out data/public/calendar-pl-2027.json

  data:private:
    desc: "Birthdays + name days: data/private/family_calendar.ics → .json (gitignored; empty days if the .ics is missing)"
    sources:
      - tools/calendar_private.py
      - uv.lock
      - data/private/family_calendar.ics
    generates:
      - data/private/family_calendar.json
    cmds:
      - uv run tools/calendar_private.py --from 2026-12-01 --to 2028-01-31 data/private/family_calendar.ics

  # ---- booklets ----

  _require-booklet:
    internal: true
    preconditions:
      - sh: '[ -n "{{.BOOKLET}}" ]'
        msg: "Pass a booklet name after --, e.g.: task preview -- calendar-a6"
      - sh: '[ -f "{{.SRC}}" ]'
        msg: "Not found: {{.SRC}}"

  preview:
    desc: Live browser preview (tinymist), for humans
    deps: [_require-booklet]
    cmds:
      - tinymist preview {{.TYPST_FLAGS}} --no-open {{.SRC}}

  watch-png:
    desc: Re-render PNG pages on every save into build/<booklet>/, for agents
    deps: [_require-booklet]
    cmds:
      - mkdir -p {{.OUT}}
      - typst watch {{.TYPST_FLAGS}} --ppi 144 {{.SRC}} "{{.OUT}}/page-{0p}.png"

  build:
    desc: Final PDF into build/<booklet>.pdf
    deps: [_require-booklet]
    cmds:
      - mkdir -p build
      - typst compile {{.TYPST_FLAGS}} {{.SRC}} build/{{.BOOKLET}}.pdf

  print:
    desc: "Print-ready A4 sheets into build/<booklet>-print.pdf (print at 100%, duplex, flip on long edge)"
    deps: [_require-booklet]
    vars:
      PAGES:
        sh: |
          typst eval {{.TYPST_FLAGS}} --in {{.SRC}} 'query(<booklet-pages>).at(0, default: (value: "")).value'
      FORMAT:
        sh: |
          typst eval {{.TYPST_FLAGS}} --in {{.SRC}} 'query(<booklet-format>).at(0, default: (value: "a6-home")).value' | tr -d '"'
    preconditions:
      - sh: '[ -n "{{.PAGES}}" ]'
        msg: "{{.SRC}} has no page count; does it use the booklet template (#show: booklet)?"
    cmds:
      - task: build
      - typst compile {{.TYPST_FLAGS}} --input pdf=/build/{{.BOOKLET}}.pdf --input pages={{.PAGES}} --input format={{.FORMAT}} lib/print.typ build/{{.BOOKLET}}-print.pdf
      - 'echo "→ build/{{.BOOKLET}}-print.pdf: {{.PAGES}} pages, {{.FORMAT}}. Print at 100%, duplex, flip on long edge. Cut, stack top halves on bottom halves, trim at crop ticks (if any), fold, nest."'

  calibration:
    desc: "Duplex calibration sheet into build/duplex-calibration.pdf (raw printer: print at 100%, duplex, long edge)"
    cmds:
      - mkdir -p build
      - typst compile {{.TYPST_FLAGS}} calibration/duplex.typ build/duplex-calibration.pdf

  docs:
    desc: Render documentation diagrams (docs/diagrams/*.typ → docs/img/*.svg)
    sources:
      - docs/diagrams/*.typ
      - lib/**/*.typ
    cmds:
      - mkdir -p docs/img
      - for: { var: DIAGRAMS }
        cmd: typst compile {{.TYPST_FLAGS}} {{.ITEM}} docs/img/$(basename {{.ITEM}} .typ).svg
    vars:
      DIAGRAMS:
        sh: ls docs/diagrams/*.typ

  clean:
    desc: Remove all build output
    cmds:
      - rm -rf build
